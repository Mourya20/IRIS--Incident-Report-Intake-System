version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: iris-postgres
    environment:
      POSTGRES_DB: iris
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: iris-backend
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/iris
      DB_USERNAME: iris
      DB_PASSWORD: iris
      JWT_SECRET: change-this-to-at-least-32-characters-long-secret
      JWT_EXPIRATION_MINUTES: 120
      VT_ENABLED: false
      VT_API_KEY:
      ABUSEIPDB_ENABLED: false
      ABUSEIPDB_API_KEY:
    ports:
      - "8080:8080"

volumes:
  postgres_data:
