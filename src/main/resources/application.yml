spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iris}
    username: ${DB_USERNAME:iris}
    password: ${DB_PASSWORD:iris}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:change-this-to-at-least-32-characters-long-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

threat-intel:
  virustotal:
    enabled: ${VT_ENABLED:false}
    api-key: ${VT_API_KEY:}
  abuseipdb:
    enabled: ${ABUSEIPDB_ENABLED:false}
    api-key: ${ABUSEIPDB_API_KEY:}

mitre:
  keyword-techniques:
    phishing: T1566
    ransomware: T1486
    powershell: T1059.001
    "credential dumping": T1003
