spring:
  datasource:
    url: jdbc:h2:mem:iris;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

security:
  jwt:
    secret: test-jwt-secret-key-with-32-chars!!!
    expiration-minutes: 120

threat-intel:
  virustotal:
    enabled: false
    api-key:
  abuseipdb:
    enabled: false
    api-key:
